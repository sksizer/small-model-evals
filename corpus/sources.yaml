# The image corpus: Wikimedia Commons files under licences that need no
# share-alike (CC0, public domain, CC BY). scripts/fetch-corpus.ts downloads
# each at 768 px into corpus/images/<id>.jpg, re-checks its licence and writes
# manifest.json and ATTRIBUTIONS.md. To extend: add an entry with a new id
# (ids are permanent; cases name them) and rerun the script. No people as
# subjects, except in the nudity-flag section. Your own photos go in private/
# (gitignored), not here. Sections in order: Commons photos, synthetic OCR
# pages, nudity flagging.
