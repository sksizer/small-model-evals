- {"id": "sp-cookery-bread", "kind": "speech", "category": "cookery", "librivox": "marion_harlands_cookery_1705_librivox", "file": "cookery_01_harland_64kb.mp3", "start": 0, "duration": 100, "summary": "Marion Harland, Cookery for Beginners, lesson 1: why good bread-making is the most important cooking skill, then home-made yeast.", "transcript": "THE question is often asked, “What is the most important branch of culinary knowledge? What the chief requisite in supplying the table well and healthfully?” The experienced housewife cannot hesitate as to the reply. Beyond doubt, the ability to make good bread. No one need rise hungry from a table on which is plenty of light, sweet bread, white or brown, and good butter. For the latter item many of us are dependent upon market and grocery. It is hardly just to hold the cook responsible for imperfections in this regard when she has bought the best articles these supply. She is culpable if she fails to see that her board furnishes three times a day a bountiful allowance of what I hope none of my friends in council will ever call “healthy bread.” The eater may be made or kept healthy by the consumption of nutritious, wholesome, healthful or healthsome food; but the most careful philologists do not speak of edibles as subject to such diseases as may afflict living creatures. While it is always wise to use none except the best flour in bread-making, it is true that skilful management of an inferior brand will often"}
- {"id": "sp-cookery-fish", "kind": "speech", "category": "cookery", "librivox": "how_cook_fish_librivox", "file": "how_to_cook_fish_01_green_64kb.mp3", "start": 0, "duration": 100, "summary": "Olive Green, How to Cook Fish, chapter 1: catching shellfish and unshelled fish, before the recipes.", "transcript": "\"First catch your hare,\" the old cookery books used to say, and hence it is proper, in a treatise devoted entirely to the cooking of Unshelled Fish, to pay passing attention to the Catching, or what the Head of the House terms the Masculine Division of the Subject. As it is evident that the catching must, in every case precede the cooking--but not too far--the preface is the place to begin. Shell-fish are, comparatively, slow of movement, without guile, pitifully trusting, and very easily caught. Observe the difference between the chunk of mutton and four feet of string with which one goes crabbing, and the complicated hooks, rods, flies, and reels devoted to the capture of unshelled fish. An unshelled fish is lively and elusive past the power of words to portray, and in this, undoubtedly, lies its desirability. People will travel for two nights and a day to some spot [Page 2] where all unshelled fish has once been seen, taking $59.99 worth of fishing tackle, \"marked down from $60.00 for to-day only,\" rent a canoe, hire a guide at more than human life is worth in courts of law, and work with dogged patience from gray"}
- {"id": "sp-gardening-vegetables", "kind": "speech", "category": "gardening", "librivox": "abcvegetablegardening_1412_librivox", "file": "vegetablegardening_00_rexford_64kb.mp3", "start": 0, "duration": 100, "summary": "Eben Rexford, ABC of Vegetable Gardening, foreword: anyone with a small plot can grow vegetables.", "transcript": "Not everybody has a garden. Some deny themselves the pleasure and the profit of one because they have never had any experience in gardening, and have somehow got the impression that special training is necessary to make a success of the undertaking. Here is where they make a mistake. There is no special \"knack\" about it. Any one who owns a bit of land, and has some time that can be given to garden-work, and an inclination to do so, can make a gardener of himself in a season--and a successful one, too--if he allows himself to be governed by the advice of some one who has had some experience along this line. After the first season he will not be likely to ask or need advice, for the practical knowledge which comes with one season's work among vegetables will not only be sufficient to enable him to go on with his gardening operations on his own responsibility, but it will have made him so enthusiastic over them that he will be eager to enlarge his knowledge of \"the green things growing,\" and in doing this he will find a pleasure that will make him wonder how he"}
- {"id": "sp-weather-dew", "kind": "speech", "category": "weather", "librivox": "meteorology_weather_explained_1205b_librivox", "file": "meteorology_02_mcpherson_64kb.mp3", "start": 0, "duration": 100, "summary": "M'Pherson, Meteorology, chapter 2: where dew comes from and how it forms.", "transcript": "The writer of the Book of Job gravely asked the important question, \"Who hath begotten the drops of dew?\" We repeat the question in another form, \"Whence comes the real dew? Does it fall from the heavens above, or does it rise from the earth beneath?\" Until about the beginning of the seventeenth century, scientific men held the opinion of ordinary observers that dew fell from the atmosphere. But there was then a reaction from this theory, for Nardius defined it as an exhalation from the earth. Of course, it was well known that dew was formed by the precipitation of the vapour of the air upon a colder body. You can see that any day for yourself by bringing a glass of very cold water into a warm room; the outer surface of the glass is dimmed at once by the moisture from the air. M. Picket was puzzled when he saw that a thermometer, suspended five feet above the ground, marked a lower temperature on clear nights than one suspended at the height of seventy-five feet; because it was always supposed that the cold of evening descended from above. Again he was puzzled when he observed"}
- {"id": "sp-sea-nautilus", "kind": "speech", "category": "sea", "librivox": "twentythousandleagues_1311_librivox", "file": "twentythousandleagues_01_verne_64kb.mp3", "start": 0, "duration": 100, "summary": "Jules Verne, Twenty Thousand Leagues Under the Sea, chapter 1: the strange sea monster sighted in 1866.", "transcript": "THE YEAR 1866 was marked by a bizarre development, an unexplained and downright inexplicable phenomenon that surely no one has forgotten. Without getting into those rumors that upset civilians in the seaports and deranged the public mind even far inland, it must be said that professional seamen were especially alarmed. Traders, shipowners, captains of vessels, skippers, and master mariners from Europe and America, naval officers from every country, and at their heels the various national governments on these two continents, were all extremely disturbed by the business. In essence, over a period of time several ships had encountered “an enormous thing” at sea, a long spindle-shaped object, sometimes giving off a phosphorescent glow, infinitely bigger and faster than any whale. The relevant data on this apparition, as recorded in various logbooks, agreed pretty closely as to the structure of the object or creature in question, its unprecedented speed of movement, its startling locomotive power, and the unique vitality with which it seemed to be gifted. If it was a cetacean, it exceeded in bulk any whale previously classified by science. No naturalist, neither Cuvier nor Lacépède, neither Professor Dumeril nor Professor de Quatrefages, would have accepted the existence"}
- {"id": "sp-sea-whaling", "kind": "speech", "category": "sea", "librivox": "moby_dick_librivox", "file": "mobydick_001_002_melville_64kb.mp3", "start": 0, "duration": 100, "summary": "Herman Melville, Moby Dick, chapter 1: Ishmael goes to sea and describes the pull of the water.", "transcript": "Call me Ishmael. Some years ago—never mind how long precisely—having little or no money in my purse, and nothing particular to interest me on shore, I thought I would sail about a little and see the watery part of the world. It is a way I have of driving off the spleen and regulating the circulation. Whenever I find myself growing grim about the mouth; whenever it is a damp, drizzly November in my soul; whenever I find myself involuntarily pausing before coffin warehouses, and bringing up the rear of every funeral I meet; and especially whenever my hypos get such an upper hand of me, that it requires a strong moral principle to prevent me from deliberately stepping into the street, and methodically knocking people’s hats off—then, I account it high time to get to sea as soon as I can. This is my substitute for pistol and ball. With a philosophical flourish Cato throws himself upon his sword; I quietly take to the ship. There is nothing surprising in this. If they but knew it, almost all men in their degree, some time or other, cherish very nearly the same feelings towards the ocean with me."}
- {"id": "sp-arctic-expedition", "kind": "speech", "category": "polar", "librivox": "polarsea_2009_librivox", "file": "polarsea_01_moss_64kb.mp3", "start": 0, "duration": 100, "summary": "Moss, Shores of the Polar Sea, chapter 1: the 1875 British Arctic expedition sails and enters the Arctic.", "transcript": "The arctic expedition of 1875 left England on 29th May, crossed the Atlantic to Davis Straits in a succession of storms, and entered the Arctic regions on 4th July. It sailed with orders to “attain the highest northern latitude, and, if possible, reach the Pole.” In old times, when voyages were longer than in these days of steam, a nautical frolic on crossing “the Line” helped to break the monotony of many a tedious passage. This time-honoured custom is slowly becoming a thing of the past. When it is gone, there will be little in sea or sky to make crossing the Equator in any way remarkable. The Tropic Zones are no better defined, and one can sail into or out of them without experiencing a single impressive sensation. But the Arctic Circle has obvious boundaries. A conspicuous change in the ordinary habits of nature warns the traveller that he is leaving the hospitable realms of earth behind him, and entering a region full of new experiences. Here familiar light and darkness cease to alternate, morning and evening no longer make the day, and in proportion as the latitude increases, day and night become mere figures of speech."}
- {"id": "sp-birds-plumage", "kind": "speech", "category": "birds", "librivox": "beautiful_birds_1907_librivox", "file": "beautifulbirds_01_selous_64kb.mp3", "start": 0, "duration": 100, "summary": "Edmund Selous, Beautiful Birds, chapter 1: how beautiful birds are, and why they are killed for plumage.", "transcript": "What beautiful things birds are! Can you think of any other creatures that are quite so beautiful? I know you will say \"Butterflies,\" and perhaps it is a race between the birds and the butterflies, but I think the birds win it even here in England. Just think of the Kingfisher, that bird that is like a little live chip of the blue sky, flying about all by itself, and doing just what it likes. The Sky-blue Butterfly is like that too, I know, but then it is a much smaller chip, and does not shine in the sun in such a wonderful way as the Kingfisher does. Neither, I think, does the Peacock-Butterfly, or the Red Admiral, or the Painted Lady, or the Greater or Lesser Tortoise-shell; and, besides, they none of them go so fast. Yes, all those butterflies are beautiful, very, very beautiful. But now, supposing they were all flying about in a field that a river was winding through, and, supposing you were sitting there too, amongst the daisies and buttercups in the bright summer sunshine, and looking at them, and supposing all at once there was a little dancing dot of light far"}
- {"id": "sp-earth-journey", "kind": "speech", "category": "earth", "librivox": "journey_centre_earth_1108_librivox", "file": "journeytothecentreoftheearth_01_verne_64kb.mp3", "start": 0, "duration": 100, "summary": "Jules Verne, Journey to the Centre of the Earth, chapter 1: the narrator recalls his uncle, Professor Lidenbrock.", "transcript": "Looking back to all that has occurred to me since that eventful day, I am scarcely able to believe in the reality of my adventures. They were truly so wonderful that even now I am bewildered when I think of them. My uncle was a German, having married my mother's sister, an Englishwoman. Being very much attached to his fatherless nephew, he invited me to study under him in his home in the fatherland. This home was in a large town, and my uncle a professor of philosophy, chemistry, geology, mineralogy, and many other ologies. One day, after passing some hours in the laboratory--my uncle being absent at the time--I suddenly felt the necessity of renovating the tissues--<i>i.e.</i>, I was hungry, and was about to rouse up our old French cook, when my uncle, Professor Von Hardwigg, suddenly opened the street door, and came rushing upstairs. Now Professor Hardwigg, my worthy uncle, is by no means a bad sort of man; he is, however, choleric and original. To bear with him means to obey; and scarcely had his heavy feet resounded within our joint domicile than he shouted for me to attend upon him. \"Harry--Harry--Harry--\" I hastened to"}
- {"id": "sp-moon-gun-club", "kind": "speech", "category": "astronomy", "librivox": "earth_to_moon_librivox", "file": "earth_to_moon_01_verne_64kb.mp3", "start": 0, "duration": 100, "summary": "Jules Verne, From the Earth to the Moon, chapter 1: the Baltimore Gun Club and its cannon-loving members.", "transcript": "During the War of the Rebellion, a new and influential club was established in the city of Baltimore in the State of Maryland. It is well known with what energy the taste for military matters became developed among that nation of ship-owners, shopkeepers, and mechanics. Simple tradesmen jumped their counters to become extemporized captains, colonels, and generals, without having ever passed the School of Instruction at West Point; nevertheless; they quickly rivaled their compeers of the old continent, and, like them, carried off victories by dint of lavish expenditure in ammunition, money, and men. But the point in which the Americans singularly distanced the Europeans was in the science of gunnery. Not, indeed, that their weapons retained a higher degree of perfection than theirs, but that they exhibited unheard-of dimensions, and consequently attained hitherto unheard-of ranges. In point of grazing, plunging, oblique, or enfilading, or point-blank firing, the English, French, and Prussians have nothing to learn; but their cannon, howitzers, and mortars are mere pocket-pistols compared with the formidable engines of the American artillery. This fact need surprise no one. The Yankees, the first mechanicians in the world, are engineers—just as the Italians are musicians and the Germans"}
- {"id": "sp-river-colorado", "kind": "speech", "category": "earth", "librivox": "canyons_colorado_0712_librivox", "file": "canyonsofthecolorado_01_powell_64kb.mp3", "start": 0, "duration": 100, "summary": "John Wesley Powell, Canyons of the Colorado, chapter 1: the Colorado River valley, its sources and its country.", "transcript": "THE Colorado River is formed by the junction of the Grand and Green. The Grand River has its source in the Rocky Mountains, five or six miles west of Long's Peak. A group of little alpine lakes, that receive their waters directly from perpetual snowbanks, discharge into a common reservoir known as Grand Lake, a beautiful sheet of water. Its quiet surface reflects towering cliffs and crags of granite on its eastern shore, and stately pines and firs stand on its western margin. The Green River heads near Fremont's Peak, in the Wind River Mountains. This river, like the Grand, has its sources in alpine lakes fed by everlasting snows. Thousands of these little lakes, with deep, cold, emerald waters, are embosomed among the crags of the Rocky Mountains. These streams, born in the cold, gloomy solitudes of the upper mountain region, have a strange, eventful history as they pass down through gorges, tumbling in cascades and cataracts, until they reach the hot, arid plains of the Lower Colorado, where the waters that were so clear above empty as turbid floods into the Gulf of California. The mouth of the Colorado is in latitude 31 degrees 53 minutes"}
- {"id": "sp-candle-lecture", "kind": "speech", "category": "science", "librivox": "chemical_history_candle_ava_librivox", "file": "chemicalhistorycandle_1_faraday_64kb.mp3", "start": 0, "duration": 100, "summary": "Michael Faraday, The Chemical History of a Candle, lecture 1: the flame, its structure and how a candle burns.", "transcript": "I purpose, in return for the honour you do us by coming to see what are our proceedings here, to bring before you, in the course of these lectures, the Chemical History of a Candle. I have taken this subject on a former occasion; and were it left to my own will, I should prefer to repeat it almost every year—so abundant is the interest that attaches itself to the subject, so wonderful are the varieties of outlet which it offers into the various departments of philosophy. There is not a law under which any part of this universe is governed which does not come into play, and is touched upon in these phenomena. There is no better, there is no more open door by which you can enter into the study of natural philosophy, than by considering the physical phenomena of a candle. I trust, therefore, I shall not disappoint you in choosing this for my subject rather than any newer topic, which could not be better, were it even so good. And before proceeding, let me say this also—that though our subject be so great, and our intention that of treating it honestly, seriously, and philosophically,"}
