- {"id":"asr-long-4992-41797-0009","kind":"transcribe","asr_kind":"long","category":"long","librispeech":"test-clean","utterances":["4992-41797-0009","4992-41797-0010","4992-41797-0011","4992-41797-0012","4992-41797-0013","4992-41797-0014","4992-41797-0015","4992-41797-0016","4992-41797-0017","4992-41797-0018"],"reference":"henry lord with the degree of ph d to his credit had been professor of zoology at a new england college but had resigned his post in order to write a series of scientific text books always irritable cold indifferent he had grown rapidly more so as years went on whatever appealed to her sense of beauty was straightway transferred to paper or canvas she is wild to know how to do things she makes effort after effort trembling with eagerness and when she fails to reproduce what she sees she works herself into a frenzy of grief and disappointment when she could not make a rabbit or a bird look real on paper she searched in her father's books for pictures of its bones cyril there must be some better way of doing i just draw the outline of an animal and then i put hairs or feathers on it they have no bodies they couldn't run nor move they're just pasteboard he wouldn't search so don't worry replied cyril quietly and the two looked at each other and knew that it was so there in the cedar hollow then lived olive lord an angry resentful little creature weighed down by a fierce sense of injury"}
- {"id":"asr-long-2094-142345-0007","kind":"transcribe","asr_kind":"long","category":"long","librispeech":"test-clean","utterances":["2094-142345-0007","2094-142345-0008","2094-142345-0009","2094-142345-0010"],"reference":"the history of the house is plain now but there is always a stronger sense of life when the sun is brilliant after rain and now he is pouring down his beams and making sparkles among the wet straw and lighting up every patch of vivid green moss on the red tiles of the cow shed and turning even the muddy water that is hurrying along the channel to the drain into a mirror for the yellow billed ducks who are seizing the opportunity of getting a drink with as much body in it as possible for the great barn doors are thrown wide open and men are busy there mending the harness under the superintendence of mister goby the whittaw otherwise saddler who entertains them with the latest treddleston gossip hetty sorrel often took the opportunity when her aunt's back was turned of looking at the pleasing reflection of herself in those polished surfaces for the oak table was usually turned up like a screen and was more for ornament than for use and she could see herself sometimes in the great round pewter dishes that were ranged on the shelves above the long deal dinner table or in the hobs of the grate which always shone like jasper"}
- {"id":"asr-long-3729-6852-0004","kind":"transcribe","asr_kind":"long","category":"long","librispeech":"test-clean","utterances":["3729-6852-0004","3729-6852-0005","3729-6852-0006","3729-6852-0007"],"reference":"her face was an enigma for it inspired everyone with the warmest sympathy and yet if you examined it attentively there was not one beautiful feature she could not be called handsome but no one could have thought her ugly silvia was the adoration of france and her talent was the real support of all the comedies which the greatest authors wrote for her especially of the plays of marivaux for without her his comedies would never have gone to posterity silvia did not think that her good conduct was a merit for she knew that she was virtuous only because her self love compelled her to be so and she never exhibited any pride or assumed any superiority towards her theatrical sisters although satisfied to shine by their talent or their beauty they cared little about rendering themselves conspicuous by their virtue two years before her death i saw her perform the character of marianne in the comedy of marivaux and in spite of her age and declining health the illusion was complete"}
