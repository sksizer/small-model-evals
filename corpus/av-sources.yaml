# The audio and video corpus (see scripts/fetch-av.ts and docs/standards/corpus.md, "Audio and video").
# kind: sound (5-30 s), speech (60-120 s, LibriVox) or video (5-15 s, no sound track). category is what the clip
# is of; the clip-to-clip `class` level groups by it. start/duration pick the segment of the source, in seconds.
# Speech `transcript` is approximate: the book text from the chapter opening, from Project Gutenberg, about as
# many words as the clip holds; the clip itself opens with the LibriVox spoken introduction. Where the book text
# was not matched there is only a `summary`. Ids are permanent; add new clips under new ids.
# Freesound is not fetched (its API needs a key); see the standard.

