# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
# extract: turn a quick-capture note into a typed entry. Ollama constrains the
# reply to the JSON schema (`format`), so the score is about the values, not
# the syntax. Today is fixed so relative dates have one right answer.
description: extract — quick-capture note to JSON

prompts:
  - |-
    [{"role": "system", "content": "You turn a quick-capture note into one JSON entry. Today is Thursday 2026-10-29. kind is workout, meal, task, event or note. date is the day the thing happened or is due, as YYYY-MM-DD, or null when the note gives no day. Convert distances to kilometres and durations to minutes. Use null for anything the note does not state."},
     {"role": "user", "content": {{ note | dump }}}]

providers:
  - id: file://../../providers/ollama-chat.ts
    label: qwen3.5:4b
    config: &config
      model: 'qwen3.5:4b'
      temperature: 0
      num_ctx: 8192
      think: false
      format: &schema
        type: object
        required: [kind, title, date, duration_min, distance_km]
        properties:
          kind: { type: string, enum: [workout, meal, task, event, note] }
          title: { type: string }
          date: { type: [string, 'null'] }
          duration_min: { type: [number, 'null'] }
          distance_km: { type: [number, 'null'] }
  - { id: file://../../providers/ollama-chat.ts, label: qwen3.5:9b, config: { <<: *config, model: 'qwen3.5:9b' } }
  - { id: file://../../providers/ollama-chat.ts, label: qwen3:4b, config: { <<: *config, model: 'qwen3:4b' } }
  - { id: file://../../providers/ollama-chat.ts, label: gemma4:e4b, config: { <<: *config, model: 'gemma4:e4b' } }
  - { id: file://../../providers/ollama-chat.ts, label: minicpm5-2b, config: { <<: *config, model: 'openbmb/minicpm5-2b:latest' } }
  - { id: file://../../providers/ollama-chat.ts, label: granite4.2:3b, config: { <<: *config, model: 'granite4.2:3b' } }
  - { id: file://../../providers/ollama-chat.ts, label: lfm3:1.7b, config: { <<: *config, model: 'lfm3:1.7b' } }
  - { id: file://../../providers/ollama-chat.ts, label: 'botpsy-0.8b', config: { <<: *config, model: 'hf.co/qvac/BotPsy-0.8B-GGUFs:Q8_0' } }
  - { id: file://../../providers/ollama-chat.ts, label: 'qwen3.5:0.8b', config: { <<: *config, model: 'qwen3.5:0.8b' } }
  - id: file://../../providers/ollama-chat.ts
    label: granite4
    config: &plain { model: 'granite4:latest', temperature: 0, num_ctx: 8192, format: *schema }
  - { id: file://../../providers/ollama-chat.ts, label: gemma3:4b, config: { <<: *plain, model: 'gemma3:4b' } }

defaultTest:
  assert:
    - type: javascript
      value: file://../../assertions/fields.ts

# One immutable file per case (README: Cases). retired/ is not loaded.
tests: file://cases/*.yaml
