# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
# classify: inbox triage into one of five labels, constrained by an enum
# schema. An embedding-plus-centroids baseline is later work.
description: classify — inbox triage label

prompts:
  - |-
    [{"role": "system", "content": "Label one inbox item for a personal notes app. task: something to do. event: something at a set time or date. journal: how the day went or how the writer feels. reference: a fact to keep and look up later. idea: a suggestion or something to explore. Reply with JSON."},
     {"role": "user", "content": {{ item | dump }}}]

providers:
  - id: file://../../providers/ollama-chat.ts
    label: qwen3.5:4b
    config: &config
      model: 'qwen3.5:4b'
      temperature: 0
      num_ctx: 4096
      # Caps a reply that runs on after the JSON (lfm3:1.7b emitted whitespace
      # until the 5-minute timeout); a right answer is about 10 tokens.
      num_predict: 64
      think: false
      format: &schema
        type: object
        required: [label]
        properties:
          label: { type: string, enum: [task, event, journal, reference, idea] }
  - { id: file://../../providers/ollama-chat.ts, label: qwen3.5:9b, config: { <<: *config, model: 'qwen3.5:9b' } }
  - { id: file://../../providers/ollama-chat.ts, label: qwen3:4b, config: { <<: *config, model: 'qwen3:4b' } }
  - { id: file://../../providers/ollama-chat.ts, label: gemma4:e4b, config: { <<: *config, model: 'gemma4:e4b' } }
  - { id: file://../../providers/ollama-chat.ts, label: minicpm5-2b, config: { <<: *config, model: 'openbmb/minicpm5-2b:latest' } }
  - { id: file://../../providers/ollama-chat.ts, label: granite4.2:3b, config: { <<: *config, model: 'granite4.2:3b' } }
  - { id: file://../../providers/ollama-chat.ts, label: lfm3:1.7b, config: { <<: *config, model: 'lfm3:1.7b' } }
  - { id: file://../../providers/ollama-chat.ts, label: 'botpsy-0.8b', config: { <<: *config, model: 'hf.co/qvac/BotPsy-0.8B-GGUFs:Q8_0' } }
  - { id: file://../../providers/ollama-chat.ts, label: 'qwen3.5:0.8b', config: { <<: *config, model: 'qwen3.5:0.8b' } }
  - id: file://../../providers/ollama-chat.ts
    label: granite4
    config: &plain { model: 'granite4:latest', temperature: 0, num_ctx: 4096, num_predict: 64, format: *schema }
  - { id: file://../../providers/ollama-chat.ts, label: gemma3:4b, config: { <<: *plain, model: 'gemma3:4b' } }

defaultTest:
  assert:
    - type: javascript
      value: file://../../assertions/fields.ts

# One immutable file per case (README: Cases). retired/ is not loaded.
tests: file://cases/*.yaml
