# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
# regions-objects: find everyday things (dogs, cups, laptops, chairs) and box
# each one, for photo search. Fixed-class detectors know these classes (COCO);
# open-vocabulary detectors are given the case's `find` list.
#
# Boxes are fractions of the image size; each case lists every box for the
# labels it asks about (Open Images validation boxes, CC BY 4.0, on CC BY 2.0
# photos picked by scripts/pick-openimages.ts). Scored by
# assertions/regions.ts: boxes matched at IoU >= 0.5, F1 of precision and
# recall, pass at 0.7. Detectors run in-process (providers/region-detector.ts,
# providers/florence2.ts); thresholds are each family's usual default (DETR
# family 0.5, OWLv2 0.2, Grounding DINO 0.3).
#
# Vision chat models (providers/ollama-boxes.ts) are asked for the same boxes
# as JSON on a 0-1000 grid, for comparison: much larger and slower than the
# detectors. gemma4 answers in [y0, x0, y1, x1] order (`order: yxyx`).
description: regions-objects — box everyday things

prompts:
  - '{{ find }}' # unused: the providers read vars directly

providers:
  - { id: file://../../providers/region-detector.ts, label: dfine-n, config: { task: object-detection, model: onnx-community/dfine_n_coco-ONNX, revision: 380d2839c327efaf65dd0fe0c2c10ab7fadd5473, dtype: fp32, threshold: 0.5, labels: { aeroplane: airplane, diningtable: dining table, motorbike: motorcycle, pottedplant: potted plant, sofa: couch, tvmonitor: tv } } }
  - { id: file://../../providers/region-detector.ts, label: dfine-s, config: { task: object-detection, model: onnx-community/dfine_s_coco-ONNX, revision: a3cf03147a9b86c78475139115c8ac142577352d, dtype: fp32, threshold: 0.5, labels: { aeroplane: airplane, diningtable: dining table, motorbike: motorcycle, pottedplant: potted plant, sofa: couch, tvmonitor: tv } } }
  - { id: file://../../providers/region-detector.ts, label: rtdetr-r18, config: { task: object-detection, model: onnx-community/rtdetr_r18vd, revision: f2bee7444f4c29003df7e9ef07c4c1c6632eca6f, dtype: fp32, threshold: 0.5, labels: { aeroplane: airplane, diningtable: dining table, motorbike: motorcycle, pottedplant: potted plant, sofa: couch, tvmonitor: tv } } }
  - { id: file://../../providers/region-detector.ts, label: owlv2-base-q8, config: { task: zero-shot-object-detection, model: onnx-community/owlv2-base-patch16-ensemble-ONNX, revision: 180d6ef7599bd69bb48db5c72bd49ad03ddfab80, dtype: q8, threshold: 0.2 } }
  - { id: file://../../providers/region-detector.ts, label: grounding-dino-tiny-q8, config: { task: zero-shot-object-detection, model: onnx-community/grounding-dino-tiny-ONNX, revision: ff690b0a8050566c290287545bd059350f3e9096, dtype: q8, threshold: 0.3, join_phrases: true } }
  - { id: file://../../providers/florence2.ts, label: florence2-base-od-q8, config: { task: od, model: onnx-community/Florence-2-base, revision: d59e079711c57174f29265539fb4cc9f0f335916, dtype: q8 } }
  - { id: file://../../providers/ollama-boxes.ts, label: qwen3.5:4b, config: { model: 'qwen3.5:4b', think: false } }
  - { id: file://../../providers/ollama-boxes.ts, label: qwen3.5:9b, config: { model: 'qwen3.5:9b', think: false } }
  - { id: file://../../providers/ollama-boxes.ts, label: gemma4:e4b, config: { model: 'gemma4:e4b', think: false, order: yxyx } }
  - { id: file://../../providers/ollama-boxes.ts, label: lfm3-vl:2b, config: { model: 'lfm3-vl:2b', think: false } }

defaultTest:
  options: { disableVarExpansion: true }
  assert:
    - type: javascript
      value: file://../../assertions/regions.ts

# One immutable file per case (README: Cases). retired/ is not loaded.
tests: file://cases/*.yaml
