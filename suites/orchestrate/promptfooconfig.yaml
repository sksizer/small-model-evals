# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
# orchestrate: pick the right tool with the right arguments, or none. One
# turn only; a multi-step agent suite is later work. Only models that
# advertise the `tools` capability run here (not gemma3:4b).
description: orchestrate — one-turn tool choice

prompts:
  - |-
    [{"role": "system", "content": "You are the assistant inside a personal notes and planning app. Today is Thursday 2026-10-29. Call a tool when the request needs one. Answer directly when it does not."},
     {"role": "user", "content": {{ request | dump }}}]

providers:
  - id: file://../../providers/ollama-chat.ts
    label: qwen3.5:4b
    config: &config { model: 'qwen3.5:4b', temperature: 0, num_ctx: 8192, think: false, tools: file://tools.yaml }
  - { id: file://../../providers/ollama-chat.ts, label: qwen3.5:9b, config: { <<: *config, model: 'qwen3.5:9b' } }
  - { id: file://../../providers/ollama-chat.ts, label: qwen3:4b, config: { <<: *config, model: 'qwen3:4b' } }
  - { id: file://../../providers/ollama-chat.ts, label: gemma4:e4b, config: { <<: *config, model: 'gemma4:e4b' } }
  - { id: file://../../providers/ollama-chat.ts, label: minicpm5-2b, config: { <<: *config, model: 'openbmb/minicpm5-2b:latest' } }
  - { id: file://../../providers/ollama-chat.ts, label: granite4.2:3b, config: { <<: *config, model: 'granite4.2:3b' } }
  - { id: file://../../providers/ollama-chat.ts, label: lfm3:1.7b, config: { <<: *config, model: 'lfm3:1.7b' } }
  - { id: file://../../providers/ollama-chat.ts, label: 'botpsy-0.8b', config: { <<: *config, model: 'hf.co/qvac/BotPsy-0.8B-GGUFs:Q8_0' } }
  - { id: file://../../providers/ollama-chat.ts, label: 'botpsy-0.8b-think', config: { model: 'hf.co/qvac/BotPsy-0.8B-GGUFs:Q8_0', temperature: 0, num_ctx: 8192, think: true, tools: file://tools.yaml } }
  - { id: file://../../providers/ollama-chat.ts, label: 'qwen3.5:0.8b', config: { <<: *config, model: 'qwen3.5:0.8b' } }
  - id: file://../../providers/ollama-chat.ts
    label: granite4
    config: { model: 'granite4:latest', temperature: 0, num_ctx: 8192, tools: file://tools.yaml }

defaultTest:
  assert:
    - type: javascript
      value: file://../../assertions/tool-call.ts

# One immutable file per case (README: Cases). retired/ is not loaded.
tests: file://cases/*.yaml
