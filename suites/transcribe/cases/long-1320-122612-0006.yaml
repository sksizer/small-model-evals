  reference: "let us retrace our steps and examine as we go with keener eyes chingachgook had caught the look and motioning with his hand he bade him speak the eyes of the whole party followed the unexpected movement and read their success in the air of triumph that the youth assumed it would have been more wonderful had he spoken without a bidding see said uncas pointing north and south at the evident marks of the broad trail on either side of him the dark hair has gone toward the forest if a rock or a rivulet or a bit of earth harder than common severed the links of the clew they followed the true eye of the scout recovered them at a distance and seldom rendered the delay of a single moment necessary extinguished brands were lying around a spring the offals of a deer were scattered about the place and the trees bore evident marks of having been browsed by the horses a circle of a few hundred feet in circumference was drawn and each of the party took a segment for his portion the examination however resulted in no discovery the whole party crowded to the spot where uncas pointed out the impression of a moccasin in the moist alluvion"
