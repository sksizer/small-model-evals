# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
# regions-text: box every line of text on a document or screen, the first step
# of reading it (or of hiding it). The pages are the synthetic corpus pages;
# their line boxes are exact, measured by scripts/text-boxes.ts in the same
# browser layout that rendered the PNG. A line is the text on one visual line
# within one block: table cells stay separate.
#
# Scored by assertions/regions.ts: boxes matched at IoU >= 0.5, F1 of
# precision and recall, pass at 0.7. A detector that splits a line into words,
# or joins two cells, loses on IoU; that is part of what this measures.
# PP-OCR's detector (providers/onnx-detector.ts) and Florence-2's
# <OCR_WITH_REGION> (providers/florence2.ts) are text detectors; the
# open-vocabulary detectors are asked for "text" for comparison.
#
# Vision chat models (providers/ollama-boxes.ts) are asked for the same boxes
# as JSON on a 0-1000 grid, for comparison: much larger and slower than the
# detectors. gemma4 answers in [y0, x0, y1, x1] order (`order: yxyx`).
description: regions-text — box every line of text

prompts:
  - '{{ find }}' # unused: the providers read vars directly

providers:
  - { id: file://../../providers/onnx-detector.ts, label: ppocr-v5-mobile-det, config: { kind: dbnet, repo: PaddlePaddle/PP-OCRv5_mobile_det_onnx, revision: e6f4fa85f00e168c862bc462aebca69eef9b3d3d, file: inference.onnx, sha256: a431985659dc921974177a95adcfbb90fd9e51989a5e04d70d0b75f597b6e61d } }
  - { id: file://../../providers/florence2.ts, label: florence2-base-ocr-q8, config: { task: ocr, model: onnx-community/Florence-2-base, revision: d59e079711c57174f29265539fb4cc9f0f335916, dtype: q8 } }
  - { id: file://../../providers/region-detector.ts, label: owlv2-base-q8, config: { task: zero-shot-object-detection, model: onnx-community/owlv2-base-patch16-ensemble-ONNX, revision: 180d6ef7599bd69bb48db5c72bd49ad03ddfab80, dtype: q8, threshold: 0.2 } }
  - { id: file://../../providers/region-detector.ts, label: grounding-dino-tiny-q8, config: { task: zero-shot-object-detection, model: onnx-community/grounding-dino-tiny-ONNX, revision: ff690b0a8050566c290287545bd059350f3e9096, dtype: q8, threshold: 0.3 } }
  - { id: file://../../providers/ollama-boxes.ts, label: qwen3.5:4b, config: { model: 'qwen3.5:4b', think: false, num_predict: 4096 } }
  - { id: file://../../providers/ollama-boxes.ts, label: gemma4:e4b, config: { model: 'gemma4:e4b', think: false, order: yxyx, num_predict: 4096 } }
  - { id: file://../../providers/ollama-boxes.ts, label: lfm3-vl:2b, config: { model: 'lfm3-vl:2b', think: false, num_predict: 4096 } }

defaultTest:
  options: { disableVarExpansion: true }
  assert:
    - type: javascript
      value: file://../../assertions/regions.ts

# One immutable file per case (README: Cases). retired/ is not loaded.
tests: file://cases/*.yaml
