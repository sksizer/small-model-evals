# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
# sensitive: say whether an image should leave the device. Beyond nudity, this covers images that
# are private for other reasons (an ID card, a chat screenshot, a child's face, a prescription, a
# house number), and asks for a risk level so an app can pick its threshold and keep a "review"
# band in between. Plan: docs/plans/sensitive.md. Corpus rules: docs/standards/corpus.md.
#
# STAGE 1 (this file): corpus and cases only. Providers, the assertion, the site UI and runs are
# stage 2, so `providers` is empty and this config does not run yet.
#
# Categories (assertions/sensitive-levels.ts is the one place they and the levels are defined):
#   nudity       explicit nudity (adults; CC0/PD photos and anatomy illustrations)
#   intimate     underwear or lingerie, not nude; beach/pool swimwear is NOT intimate (Q2)
#   minor        a child in an ordinary public scene (Open Images only, marked sensitive)
#   face         a clear face is the subject (a portrait); crowds and distant figures do not count
#   id-document  passport, driving licence, ID card (synthetic specimens)
#   financial    bank card, statement, payslip, bill, tax notice (synthetic)
#   screen       personal data on a screen: chat, email, notifications, contacts (synthetic, plus two phones)
#   medical      prescription, lab result, X-ray, hospital scenes
#   location     readable number plate, house number, a name with a home address
#   credential   password, Wi-Fi key, one-time code, API key, boarding-pass barcode
#   document     a private letter, contract, note or notice
#
# Level: derived from the categories, never stored in a case. nudity, id-document, financial and
# credential give `private`; any other category gives `review`; none gives `public`
# (levelOf in assertions/sensitive-levels.ts). A missed private image (called public) is a leak
# and weighs 3:1 against a false alarm (Q4); the pass mark is no private image called public.
#
# Cases: one per image in cases/, `vars.expected.categories` lists every category shown.
# Hard negatives that must stay `public`: nude art (the nudity-flag convention: art is not
# flagged), swimwear at a beach, a blank ID template, public pages (product, menu, timetable,
# marketing email), a car whose plate is blurred or unreadable, screens with no personal data.
# Synthetic pages (category sensitive-doc) carry invented details, SPECIMEN on cards and Luhn-failing
# card numbers; results can be split between real photos and rendered pages. The sensitive images
# (nudity, intimate, minor) are covered on the results site until the viewer asks to see them.
#
# Providers still to add in stage 2 (plan, Models):
#   - vision LLMs with the category list, schema-constrained: qwen3.5:4b, qwen3.5:9b, lfm3-vl:2b, gemma4:e4b
#   - LlavaGuard 1.2 0.5B (Q6: include if a runtime is feasible)
#   - zero-shot image-text: SigLIP 2 base, CLIP ViT-B/16 (ONNX)
#   - specialists as signals: YuNet faces, the two NSFW ViTs, Florence-2 OCR plus patterns
#   - a composite: specialists first, the LLM only when they are unsure
description: sensitive — which images should not leave the device

prompts:
  - '{{ question }}' # unused: the providers read vars directly

providers: [] # TODO stage 2

defaultTest:
  options: { disableVarExpansion: true }

# One immutable file per case (README: Cases). retired/ is not loaded.
tests: file://cases/*.yaml
