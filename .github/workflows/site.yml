# Checks every push and pull request, and publishes the results site from
# main to GitHub Pages. Pages must be enabled with "GitHub Actions" as the
# source (Settings → Pages).
name: site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # check:evals compares the ledger with the base commit
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - name: Immutability checks
        run: |
          # The ledger is append-only: what existed before this push or PR must
          # still be a prefix of every ledger file.
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then base=HEAD; fi
          EVALS_BASE="$base" bun run check:evals
      - name: Build site
        env:
          SITE_BASE: /${{ github.event.repository.name }}
        run: cd site && bun install --frozen-lockfile && bun run build && bunx astro check
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: site/dist

  deploy:
    needs: check
    # Pages serves only a public repo here; while the repo is private the
    # site is built and checked but not deployed.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && !github.event.repository.private
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
